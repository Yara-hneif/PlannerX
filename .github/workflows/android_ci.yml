name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master", "feature/devops-pipeline" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Android APK with Docker
        run: |
          docker build -t android-builder .
          docker run --rm -v ${{ github.workspace }}:/project android-builder ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlannerX-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk